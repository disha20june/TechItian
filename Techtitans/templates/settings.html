<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | GovVerify AI</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f8fc;
            color: #14284b;
            min-height: 100vh;
            padding: 35px;
            transition: 0.3s;
        }

        .settings-container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .header h1 {
            font-size: 30px;
        }

        .back-btn {
            text-decoration: none;
            background: #176ce5;
            color: white;
            padding: 11px 17px;
            border-radius: 8px;
        }

        .settings-card {
            background: white;
            border: 1px solid #e2eaf4;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 8px 25px rgba(25, 62, 100, 0.06);
        }

        .settings-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .settings-card p {
            color: #7185a0;
            margin-bottom: 20px;
        }

        .theme-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .theme-btn {
            border: 1px solid #d7e2ef;
            background: #f5f8fc;
            color: #203d62;
            padding: 14px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .theme-btn:hover {
            background: #e4efff;
        }

        .theme-btn.active {
            background: #176ce5;
            color: white;
            border-color: #176ce5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e2ef;
            border-radius: 8px;
            font-size: 14px;
        }

        .submit-btn {
            border: none;
            background: #176ce5;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .flash-message {
            padding: 13px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #a51d1d;
        }

        /* Dark mode */

        body.dark-mode {
            background: #101827;
            color: #e8eef8;
        }

        body.dark-mode .settings-card {
            background: #1b2638;
            border-color: #334155;
        }

        body.dark-mode .settings-card p {
            color: #a9b8ce;
        }

        body.dark-mode .theme-btn {
            background: #253247;
            color: #e8eef8;
            border-color: #42536b;
        }

        body.dark-mode .theme-btn.active {
            background: #176ce5;
            color: white;
        }

        body.dark-mode .form-group input {
            background: #253247;
            color: white;
            border-color: #42536b;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>

<body>

<div class="settings-container">

    <div class="header">

        <h1>
            <i class="bi bi-gear-fill"></i>
            Settings
        </h1>

        <a
            href="{{ url_for('citizen_dashboard') }}"
            class="back-btn"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>

    </div>


    <!-- Theme Settings -->

    <div class="settings-card">

        <h2>
            <i class="bi bi-palette"></i>
            Appearance
        </h2>

        <p>
            Choose how GovVerify AI looks on your device.
        </p>

        <div class="theme-buttons">

            <button
                class="theme-btn"
                id="lightBtn"
                onclick="setTheme('light')"
            >
                <i class="bi bi-sun-fill"></i>
                Light Mode
            </button>

            <button
                class="theme-btn"
                id="darkBtn"
                onclick="setTheme('dark')"
            >
                <i class="bi bi-moon-stars-fill"></i>
                Dark Mode
            </button>

        </div>

    </div>


    <!-- Change Password -->

    <div class="settings-card">

        <h2>
            <i class="bi bi-shield-lock"></i>
            Change Password
        </h2>

        <p>
            Update your account password securely.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('change_password') }}"
        >

            <div class="form-group">

                <label for="current_password">
                    Current Password
                </label>

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                <i class="bi bi-check-circle"></i>
                Update Password
            </button>

        </form>

    </div>

</div>


<script>

    function setTheme(theme) {

        if (theme === "dark") {

            document.body.classList.add("dark-mode");

            localStorage.setItem(
                "govverify-theme",
                "dark"
            );

        } else {

            document.body.classList.remove("dark-mode");

            localStorage.setItem(
                "govverify-theme",
                "light"
            );

        }

        updateThemeButtons();

    }


    function updateThemeButtons() {

        const theme = localStorage.getItem("govverify-theme") || "light";

        document.getElementById("lightBtn")
            .classList.toggle(
                "active",
                theme === "light"
            );

        document.getElementById("darkBtn")
            .classList.toggle(
                "active",
                theme === "dark"
            );

    }


    // Load saved theme
    const savedTheme = localStorage.getItem("govverify-theme") || "light";

    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
    }

    updateThemeButtons();

</script>

</body>
</html>
