{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4">My Profile</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           name="full_name"
                           class="form-control"
                           value="{{ user.full_name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <input type="text"
                           class="form-control"
                           value="{{ user.role|capitalize }}"
                           readonly>
                </div>

                {% if user.role == "officer" %}
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text"
                           class="form-control"
                           value="{{ user.department or 'Not Assigned' }}"
                           readonly>
                </div>
                {% endif %}

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                {% if user.role == "officer" %}
                    <a href="{{ url_for('officer_routes.officer_dashboard') }}"
                       class="btn btn-secondary">
                        Back
                    </a>
                {% elif user.role == "admin" or user.role == "super_admin" %}
                    <a href="{{ url_for('admin_routes.admin_dashboard') }}"
                       class="btn btn-secondary">
                        Back
                    </a>
                {% else %}
                    <a href="{{ url_for('citizen_dashboard') }}"
                       class="btn btn-secondary">
                        Back
                    </a>
                {% endif %}

            </form>
        </div>
    </div>
</div>
{% endblock %}
